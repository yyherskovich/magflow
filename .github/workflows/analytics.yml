name: Check site-wide analytics

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every HTML page has one Google tag
        run: node scripts/analytics.mjs
